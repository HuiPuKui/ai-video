<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风格 A · 剪纸拼贴 — 我们都是渺小真实存在</title>
<style>
  html,body{margin:0;height:100%;background:#1a1614;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  svg{width:min(100vw,177.78vh);height:auto;display:block}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3a2a20" flood-opacity="0.32"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3a2a20" flood-opacity="0.3"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.26  0 0 0 0 0.2  0.9 0 0 0 -0.32"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#eee4d4"/>
  <g id="sky"></g>
  <g id="far"></g>
  <g id="band"></g>
  <g id="crowd"></g>
  <g id="ground"></g>
  <g id="him"></g>
  <g id="lyric"></g>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55" pointer-events="none"/>
  <text x="1872" y="52" text-anchor="end" font-size="18" fill="#8a7b6c" letter-spacing="4" font-family="Songti SC, Noto Serif CJK SC, serif">风格 A · 剪纸拼贴</text>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const rng = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };
const f = (v) => (+v).toFixed(1);

// 手剪的矩形：边缘带轻微抖动
function cutRect(x, y, w, h, j, r, step = 8) {
  const pts = [];
  const edge = (x0, y0, x1, y1) => {
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let i = 0; i < n; i++) { const k = i / n; pts.push([x0 + (x1 - x0) * k + (r() - .5) * j, y0 + (y1 - y0) * k + (r() - .5) * j]); }
  };
  edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
  return 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
}
// 撕纸边的带状
function tornBand(x0, x1, y, amp, bottom, r, step = 16) {
  let d = `M${x0} ${bottom}`;
  for (let x = x0; x <= x1 + step; x += step) d += `L${f(x)} ${f(y + (r() - .5) * amp + Math.sin(x * 0.004) * amp)}`;
  return d + `L${x1 + step} ${bottom}Z`;
}
// 拼图块的一条边：d=+1 向外凸，-1 向内凹，0 平
function tabEdge(P, Q, d) {
  const ux = Q[0] - P[0], uy = Q[1] - P[1], nx = uy, ny = -ux;
  const pt = (s, h) => f(P[0] + ux * s + nx * h) + ' ' + f(P[1] + uy * s + ny * h);
  if (!d) return `L${pt(1, 0)}`;
  return `L${pt(.38, 0)}C${pt(.44, .06 * d)} ${pt(.22, .27 * d)} ${pt(.5, .28 * d)}C${pt(.78, .27 * d)} ${pt(.56, .06 * d)} ${pt(.62, 0)}L${pt(1, 0)}`;
}
function piece(x, y, w, h, dt, dr, db, dl) {
  return `M${f(x)} ${f(y)}` + tabEdge([x, y], [x + w, y], dt) + tabEdge([x + w, y], [x + w, y + h], dr) +
    tabEdge([x + w, y + h], [x, y + h], db) + tabEdge([x, y + h], [x, y], dl) + 'Z';
}

// ---------- Clawd（纸片版，关节像皮影一样分件） ----------
const LEGX = [-26, -14, 6, 18];
const PAL = {
  him:   { body: '#CC8B89', hi: '#E09D9B', arm: '#E9BBBA', leg: '#E09B9B', eye: '#1c1315' },
  grey:  { body: '#b7ada3', hi: '#c6bdb3', arm: '#c4bbb1', leg: '#aca297', eye: '#6b625b' },
  grey2: { body: '#a69c92', hi: '#b5aba1', arm: '#b3a99f', leg: '#9d9389', eye: '#5d554f' },
};
function paperClawd(parent, pal, seed, border = 4) {
  const r = rng(seed);
  const root = $('g', {}, parent);
  const part = (d, fill, g) => $('path', { d, fill, stroke: border ? '#fbf7ef' : 'none', 'stroke-width': border, 'stroke-linejoin': 'round', 'paint-order': 'stroke' }, g);
  const legA = $('g', {}, root), legB = $('g', {}, root);
  LEGX.forEach((x, i) => part(cutRect(x, -3, 8, 16, 1.2, r, 5), pal.leg, i % 2 ? legB : legA));
  const armL = $('g', {}, root), armR = $('g', {}, root);
  part(cutRect(-68, -45, 13, 12, 1.2, r, 5), pal.arm, armL);
  part(cutRect(55, -45, 13, 12, 1.2, r, 5), pal.arm, armR);
  const body = $('g', {}, root);
  part(cutRect(-56, -56, 112, 56, 1.8, r, 9), pal.body, body);
  $('path', { d: cutRect(-52, -52, 6, 46, 0.8, r, 6), fill: pal.hi }, body);
  const eyes = $('g', {}, body);
  $('path', { d: cutRect(-9, -40, 6, 10, 0.6, r, 4), fill: pal.eye }, eyes);
  $('path', { d: cutRect(3, -40, 6, 10, 0.6, r, 4), fill: pal.eye }, eyes);
  return { root, legA, legB, armL, armR, body, eyes };
}
function pose(c, ph, x, y, s, blink = 0) {
  const S = Math.sin(ph), C = Math.cos(ph), bob = -Math.abs(S) * 3.5;
  c.root.setAttribute('transform', `translate(${f(x)} ${f(y)}) scale(${s})`);
  c.legA.setAttribute('transform', `translate(${f(C * 2.5)} ${f(-Math.max(0, S) * 7)})`);
  c.legB.setAttribute('transform', `translate(${f(-C * 2.5)} ${f(-Math.max(0, -S) * 7)})`);
  c.body.setAttribute('transform', `translate(0 ${f(bob)}) rotate(${f(S * 2.4)})`);
  c.armL.setAttribute('transform', `translate(0 ${f(bob + S * 3)})`);
  c.armR.setAttribute('transform', `translate(0 ${f(bob - S * 3)})`);
  const k = 1 - 0.9 * blink;
  c.eyes.setAttribute('transform', `translate(0 -30) scale(1 ${k.toFixed(2)}) translate(0 30)`);
}

// ---------- 天空：撕纸太阳 + 纸云 ----------
const sky = document.getElementById('sky');
{
  const r = rng(2);
  let d = '';
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2, rad = 170 + (r() - .5) * 9;
    d += (i ? 'L' : 'M') + f(1400 + Math.cos(a) * rad) + ' ' + f(300 + Math.sin(a) * rad);
  }
  $('path', { d: d + 'Z', fill: '#f3c9c6', filter: 'url(#shadow)' }, sky);
  $('path', { d: cutRect(1300, 230, 140, 12, 2, r, 10), fill: '#f8dad6' }, sky);
}
const clouds = [];
{
  const r = rng(5);
  for (let i = 0; i < 4; i++) {
    const g = $('g', { filter: 'url(#shadowSm)' }, sky);
    const w = 220 + r() * 160;
    let d = '';
    for (let k = 0; k <= 40; k++) {
      const a = k / 40 * Math.PI * 2;
      const bump = 1 + 0.18 * Math.max(0, Math.sin(a * 5 + i)) * (Math.sin(a) < 0 ? 1 : 0);
      d += (k ? 'L' : 'M') + f(Math.cos(a) * w / 2 * bump + (r() - .5) * 5) + ' ' + f(Math.sin(a) * w / 6.5 * bump + (r() - .5) * 4);
    }
    $('path', { d: d + 'Z', fill: i % 2 ? '#f7f1e6' : '#efe6d8' }, g);
    clouds.push({ g, x: r() * 2400, y: 140 + r() * 300, v: 8 + r() * 10 });
  }
}

// ---------- 远景城市（视差 18px/s） ----------
const TW = 2240;
function wrapLayer(parent, build) {
  const g = $('g', {}, parent);
  const a = $('g', {}, g), b = $('g', { transform: `translate(${TW} 0)` }, g);
  build(a, 1); build(b, 1);
  return g;
}
const far = wrapLayer(document.getElementById('far'), (g) => {
  const r = rng(11);
  let x = -20;
  while (x < TW) {
    const w = 90 + r() * 130, h = 140 + r() * 300, top = 720 - h;
    const tone = ['#d8cdbf', '#cfc3b4', '#ddd3c6'][Math.floor(r() * 3)];
    const bg = $('g', { filter: 'url(#shadowSm)' }, g);
    $('path', { d: cutRect(x, top, w, h + 20, 2.4, r, 14), fill: tone }, bg);
    for (let wy = top + 26; wy < 690; wy += 38) for (let wx = x + 16; wx < x + w - 24; wx += 30)
      if (r() > 0.35) $('path', { d: cutRect(wx, wy, 14, 18, 1, r, 5), fill: r() > 0.93 ? '#f3c9c6' : '#ece3d5' }, bg);
    x += w + 8 + r() * 30;
  }
});
const band = wrapLayer(document.getElementById('band'), (g) => {
  const r = rng(13);
  $('path', { d: tornBand(-20, TW + 20, 700, 18, 900, r), fill: '#c9bcab', filter: 'url(#shadow)' }, g);
  $('path', { d: tornBand(-20, TW + 20, 742, 12, 900, r, 12), fill: '#bfb2a1' }, g);
});

// ---------- 人群：灰色的纸片 Clawd，逆着他走 ----------
const crowdG = document.getElementById('crowd');
const crowd = [];
{
  const r = rng(21);
  for (let i = 0; i < 15; i++) {
    const s = 0.95 + r() * 0.55;
    const c = paperClawd(crowdG, r() > .5 ? PAL.grey : PAL.grey2, 100 + i, 3);
    c.root.setAttribute('filter', 'url(#shadowSm)');
    crowd.push({ c, x: i * 160 + r() * 60, y: 772 + r() * 22, s, v: 120 + r() * 70, ph: r() * 6 });
  }
  crowd.sort((a, b) => a.y - b.y).forEach(p => crowdG.appendChild(p.c.root));
}

// ---------- 地面：一整条拼图，缺了一块 ----------
const groundL = document.getElementById('ground');
$('rect', { x: 0, y: 830, width: 1920, height: 250, fill: '#5b4a3e' }, groundL);
const N = 16, PW = 140, PH = 140, GY = 838;
const ground = wrapLayer(groundL, (g) => {
  const r = rng(31);
  const T = Array.from({ length: N }, () => r() > .5 ? 1 : -1);
  const Hs = Array.from({ length: N }, () => r() > .5 ? 1 : -1);
  const V = [0, 1].map(() => Array.from({ length: N }, () => r() > .5 ? 1 : -1));
  const tones = ['#d7ccbe', '#cdc1b2', '#e0d6c9', '#c6b9a9', '#d2c6b7'];
  for (let row = 0; row < 2; row++) for (let c = 0; c < N; c++) {
    const x = c * PW, y = GY + row * PH;
    const dt = row === 0 ? 0 : -Hs[c], db = row === 0 ? Hs[c] : 0;
    const dl = -V[row][c], dr = V[row][(c + 1) % N];
    const d = piece(x, y, PW, PH, dt, dr, db, dl);
    const missing = row === 0 && c === 9;
    if (missing) {
      $('path', { d, fill: '#3e3129' }, g);
      $('path', { d, fill: 'none', stroke: '#F4A8C2', 'stroke-width': 3, 'stroke-dasharray': '10 8', opacity: .9 }, g);
      continue;
    }
    const rot = (r() - .5) * 1.2;
    $('path', { d, fill: tones[Math.floor(r() * tones.length)], stroke: '#f6f0e6', 'stroke-width': 2,
      filter: 'url(#shadowSm)', transform: `rotate(${f(rot)} ${x + PW / 2} ${y + PH / 2})` }, g);
  }
});

// ---------- 他：唯一有颜色的那个，头顶顶着一块粉色拼图 ----------
const himL = document.getElementById('him');
const shadowEl = $('ellipse', { cx: 0, cy: 0, rx: 120, ry: 14, fill: '#3a2a20', opacity: .22 }, himL);
const him = paperClawd(himL, PAL.him, 7, 4);
him.root.setAttribute('filter', 'url(#shadow)');
const carry = $('g', {}, him.body);
$('path', { d: piece(-17, -96, 34, 34, 1, -1, 0, 1), fill: '#F4A8C2', stroke: '#fbf7ef', 'stroke-width': 3.5, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, carry);
$('path', { d: cutRect(-13, -92, 5, 26, 0.5, rng(3), 5), fill: '#f9c9d8' }, carry);
// 手举着拼图：两只手的位置抬到头顶两侧
him.armL.querySelector('path').setAttribute('d', cutRect(-34, -70, 12, 12, 1.2, rng(8), 5));
him.armR.querySelector('path').setAttribute('d', cutRect(22, -70, 12, 12, 1.2, rng(9), 5));

// ---------- 歌词：像剪报一样，一个字一张纸 ----------
const lyricL = document.getElementById('lyric');
const TEXT = [...'我们都是渺小真实存在'];
const chars = [];
{
  const r = rng(41);
  const tones = ['#fbf7ef', '#efe3cf', '#e6dccd', '#f6e9dc'];
  TEXT.forEach((ch, i) => {
    const pink = i >= 8;
    const g = $('g', { filter: 'url(#shadowSm)' }, lyricL);
    const w = 92 + r() * 14;
    $('path', { d: cutRect(-w / 2, -w / 2, w, w, 2.4, r, 10), fill: pink ? '#F4A8C2' : tones[Math.floor(r() * tones.length)] }, g);
    const t = $('text', { x: 0, y: 22, 'text-anchor': 'middle', 'font-size': 62 + Math.round(r() * 8), 'font-weight': 700,
      fill: pink ? '#fff7fa' : '#2b221d', 'font-family': i % 3 === 1 ? 'Kaiti SC, STKaiti, serif' : 'Songti SC, Noto Serif CJK SC, serif' }, g);
    t.textContent = ch;
    chars.push({ g, x: 170 + i * 112, y: 150 + (r() - .5) * 26, rot: (r() - .5) * 12 });
  });
}

// ---------- 动画 ----------
const STEP = 0.852;          // 两步一个循环 ≈ 140 BPM 每拍一步
const SPEED = 110;           // 地面滚动速度 px/s
const LOOP = 8;
const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  const ph = t / STEP * Math.PI * 2;

  clouds.forEach(c => c.g.setAttribute('transform', `translate(${f(((c.x - t * c.v) % 2400 + 2400) % 2400 - 240)} ${f(c.y)})`));
  far.setAttribute('transform', `translate(${f(-(t * 18 % TW))} 0)`);
  band.setAttribute('transform', `translate(${f(-(t * 40 % TW))} 0)`);
  ground.setAttribute('transform', `translate(${f(-(t * SPEED % TW))} 0)`);

  crowd.forEach(p => {
    const x = ((p.x - t * p.v) % 2400 + 2400) % 2400 - 240;
    pose(p.c, ph * (p.v / 150) + p.ph, x, p.y, p.s);
  });

  const lt = t % 4.2;
  const blink = lt > 3.0 && lt < 3.2 ? Math.sin((lt - 3.0) / 0.2 * Math.PI) : 0;
  const hx = 700, hy = GY - 14;
  pose(him, ph, hx, hy, 2.5, blink);
  carry.setAttribute('transform', `rotate(${f(Math.sin(ph + 0.6) * 3)} 0 -62)`);
  shadowEl.setAttribute('cx', hx); shadowEl.setAttribute('cy', GY + 22);
  shadowEl.setAttribute('rx', f(118 - Math.abs(Math.sin(ph)) * 8));

  const ct = t % LOOP;
  chars.forEach((c, i) => {
    const k = Math.min(1, Math.max(0, (ct - 0.3 - i * 0.32) / 0.28));
    const out = Math.min(1, Math.max(0, (ct - (LOOP - 0.6)) / 0.5));
    const s = k <= 0 ? 0 : (1 + 0.25 * Math.sin(k * Math.PI)) * (1 - out);
    c.g.setAttribute('transform', `translate(${f(c.x)} ${f(c.y - (1 - k) * 30)}) rotate(${f(c.rot * (0.4 + 0.6 * k))}) scale(${s.toFixed(3)})`);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
