<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风格 C · 铅笔手账 — 我们都是渺小真实存在</title>
<style>
  html,body{margin:0;height:100%;background:#2a2622;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:auto;display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 铅笔手账：整幅画像画在日记本里，线条每 1/8 秒重描一次（line boil），
// 世界是铅笔灰，只有他被蜡笔涂上了颜色。画面向左卷动，他一直在走。
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 1920, H = 1080, GROUND = 720, WALK = 870;
const rng = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };

let R = Math.random;         // 每次重描时会换种子
const PEN = '#3b3631';

// 手抖线：两遍略有偏差的折线
function line(x0, y0, x1, y1, w = 2.2, col = PEN, passes = 2) {
  const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 26));
  x.strokeStyle = col; x.lineCap = 'round'; x.lineJoin = 'round';
  for (let p = 0; p < passes; p++) {
    x.lineWidth = w * (p ? 0.6 : 1); x.globalAlpha = p ? 0.5 : 0.9;
    x.beginPath();
    for (let i = 0; i <= n; i++) {
      const k = i / n, j = (i === 0 || i === n) ? 1.2 : 2.4;
      const px = x0 + (x1 - x0) * k + (R() - .5) * j, py = y0 + (y1 - y0) * k + (R() - .5) * j;
      i ? x.lineTo(px, py) : x.moveTo(px + (R() - .5) * 4, py);
    }
    x.stroke();
  }
  x.globalAlpha = 1;
}
function box(bx, by, w, h, lw, col) {
  line(bx - 3, by, bx + w + 4, by, lw, col); line(bx + w, by - 3, bx + w, by + h + 3, lw, col);
  line(bx + w + 3, by + h, bx - 4, by + h, lw, col); line(bx, by + h + 3, bx, by - 4, lw, col);
}
// 排线阴影
function hatch(bx, by, w, h, gap, col, alpha = 0.35) {
  x.save(); x.beginPath(); x.rect(bx, by, w, h); x.clip();
  x.globalAlpha = alpha; x.strokeStyle = col; x.lineWidth = 1.3;
  for (let s = -h; s < w; s += gap) { x.beginPath(); x.moveTo(bx + s + (R() - .5) * 2, by + h); x.lineTo(bx + s + h + (R() - .5) * 2, by); x.stroke(); }
  x.restore();
}
// 蜡笔填色：一堆短促的斜笔触
function crayon(bx, by, w, h, col, density = 1) {
  x.save(); x.beginPath(); x.rect(bx - 2, by - 2, w + 4, h + 4); x.clip();
  x.strokeStyle = col; x.lineCap = 'round';
  const n = Math.round(w * h / 140 * density);
  for (let i = 0; i < n; i++) {
    const px = bx + R() * w, py = by + R() * h, l = 18 + R() * 26;
    x.globalAlpha = 0.35 + R() * 0.35; x.lineWidth = 3 + R() * 4;
    x.beginPath(); x.moveTo(px - l / 2, py + l * 0.25); x.lineTo(px + l / 2, py - l * 0.25); x.stroke();
  }
  x.restore(); x.globalAlpha = 1;
}

// ---------- 纸 ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
{
  const g = paper.getContext('2d'), r = rng(5);
  g.fillStyle = '#f5efe2'; g.fillRect(0, 0, W, H);
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  g.strokeStyle = 'rgba(120,150,190,0.22)'; g.lineWidth = 1.5;
  for (let y = 96; y < H; y += 54) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = 'rgba(220,110,120,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(132, 0); g.lineTo(132, H); g.stroke();
  // 装订孔
  g.fillStyle = '#2a2622';
  for (let y = 80; y < H; y += 160) { g.beginPath(); g.arc(56, y, 16, 0, Math.PI * 2); g.fill(); }
}

// ---------- 场景元素（世界坐标，循环 3000px） ----------
const LOOPW = 3000;
const HOUSES = (() => { const r = rng(11); const out = []; let px = 0; while (px < LOOPW) { const w = 120 + r() * 140, h = 110 + r() * 260; out.push({ x: px, w, h, roof: r() > .5, win: Math.floor(r() * 4) + 2, tree: r() > .6 }); px += w + 30 + r() * 90; } return out; })();
const PEOPLE = (() => { const r = rng(23); return Array.from({ length: 11 }, (_, i) => ({ x: i * 280 + r() * 90, s: 0.75 + r() * 0.3, v: 50 + r() * 70, dir: r() > .35 ? -1 : 1, ph: r() * 6 })); })();
const BIRDS = (() => { const r = rng(31); return Array.from({ length: 6 }, () => ({ x: r() * W, y: 160 + r() * 200, v: 30 + r() * 30, ph: r() * 6 })); })();

function house(h, ox) {
  const bx = h.x - ox, by = GROUND - h.h;
  if (bx > W + 50 || bx + h.w < 140) return;
  hatch(bx, by, h.w, h.h, 11, '#6d655c', 0.18);
  box(bx, by, h.w, h.h, 2.2);
  if (h.roof) { line(bx - 14, by, bx + h.w / 2, by - 70); line(bx + h.w / 2, by - 70, bx + h.w + 14, by); }
  for (let i = 0; i < h.win; i++) {
    const wx = bx + 18 + (i % 2) * (h.w - 70), wy = by + 26 + Math.floor(i / 2) * 70;
    if (wy + 40 > GROUND - 20) continue;
    box(wx, wy, 34, 40, 1.6); line(wx + 17, wy, wx + 17, wy + 40, 1.1); line(wx, wy + 20, wx + 34, wy + 20, 1.1);
  }
  if (h.tree) {
    const tx = bx + h.w + 16;
    line(tx, GROUND, tx, GROUND - 110, 2.4);
    x.strokeStyle = PEN; x.lineWidth = 2; x.globalAlpha = .8; x.beginPath();
    for (let k = 0; k <= 22; k++) { const a = k / 22 * Math.PI * 2, rad = 46 + Math.sin(a * 6) * 8 + (R() - .5) * 5; x[k ? 'lineTo' : 'moveTo'](tx + Math.cos(a) * rad, WALK - 170 + Math.sin(a) * rad * 0.8); }
    x.stroke(); x.globalAlpha = 1;
  }
}

// ---------- Clawd ----------
function clawd(cx, cy, s, ph, colored, flip = 1, blink = 0) {
  const S = Math.sin(ph), C = Math.cos(ph), bob = -Math.abs(S) * 3 * s;
  x.save(); x.translate(cx, cy); x.scale(flip, 1);
  const q = (a, b, w, h) => [a * s, b * s, w * s, h * s];
  // 腿
  [[-26, 0], [-14, 1], [6, 0], [18, 1]].forEach(([lx, k]) => {
    const lift = (k ? Math.max(0, -S) : Math.max(0, S)) * 7;
    const [a, b, w, h] = q(lx + (k ? -C : C) * 2.5, -2 - lift, 8, 15);
    x.fillStyle = '#f5efe2'; x.fillRect(a, b, w, h);
    if (colored) crayon(a, b, w, h, '#d98c8a', 2.4);
    box(a, b, w, h, 1.8);
  });
  x.translate(0, bob); x.rotate(S * 0.03);
  // 手
  [[-68, -45 + S * 3], [55, -45 - S * 3]].forEach(([ax, ay]) => {
    const [a, b, w, h] = q(ax, ay, 13, 12);
    x.fillStyle = '#f5efe2'; x.fillRect(a, b, w, h);
    if (colored) crayon(a, b, w, h, '#eab2b1', 2.4);
    box(a, b, w, h, 1.8);
  });
  // 身体
  const [a, b, w, h] = q(-56, -56, 112, 56);
  x.fillStyle = '#f5efe2'; x.fillRect(a, b, w, h);
  if (colored) { crayon(a, b, w, h, '#cf7f7d', 1.6); crayon(a, b, w * 0.12, h, '#eea9a6', 2); }
  else hatch(a, b, w, h, 9, '#4d4740', 0.25);
  box(a, b, w, h, colored ? 3 : 2);
  // 眼
  const eh = 10 * (1 - 0.9 * blink);
  x.fillStyle = PEN;
  x.fillRect(-9 * s, (-40 + 10 - eh) * s, 6 * s, eh * s); x.fillRect(3 * s, (-40 + 10 - eh) * s, 6 * s, eh * s);
  x.restore();
}

// ---------- 歌词：手写在横线上，像正在写 ----------
const TEXT = [...'我们都是渺小真实存在'];
function lyric(t) {
  const ct = t % 8;
  x.save();
  x.font = '400 78px "Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",serif';
  x.textBaseline = 'alphabetic';
  const x0 = 220, y0 = 258, gap = 92;
  TEXT.forEach((ch, i) => {
    const k = Math.max(0, Math.min(1, (ct - 0.3 - i * 0.3) / 0.25));
    if (k <= 0) return;
    const out = Math.max(0, Math.min(1, (ct - 7.3) / 0.5));
    const cx = x0 + i * gap;
    // 逐字从上往下"写出来"
    x.save(); x.beginPath(); x.rect(cx - 10, y0 - 80, gap, 100 * k); x.clip();
    x.globalAlpha = 1 - out;
    x.fillStyle = i >= 8 ? '#d9677e' : '#2d2a26';
    x.fillText(ch, cx + (R() - .5) * 1.2, y0 + (R() - .5) * 1.2);
    x.restore();
  });
  // "渺小"下面画一道波浪线
  const k2 = Math.max(0, Math.min(1, (ct - 2.4) / 0.4));
  if (k2 > 0 && ct < 7.5) {
    x.strokeStyle = '#d9677e'; x.lineWidth = 3; x.beginPath();
    for (let i = 0; i <= 40 * k2; i++) { const px = x0 + 4 * gap + i * 4.6; x[i ? 'lineTo' : 'moveTo'](px, y0 + 22 + Math.sin(i * 0.9) * 5 + (R() - .5) * 1.5); }
    x.stroke();
  }
  x.restore();
}

// ---------- 主循环：画面每 1/8 秒重描一次（12fps 的手绘感），位移仍是连续的 ----------
const BOIL = 1 / 8;
let lastBoil = -1;
function frame(now) {
  const t = now / 1000;
  const boil = Math.floor(t / BOIL);
  R = rng(boil * 7 + 1);
  const tq = boil * BOIL;    // 动作也量化到 12fps，更像手绘逐帧
  x.drawImage(paper, 0, 0);

  // 太阳：铅笔圈 + 一点点彩铅
  {
    const sx = 1560, sy = 250;
    x.strokeStyle = PEN; x.lineWidth = 2.2; x.beginPath();
    for (let k = 0; k <= 30; k++) { const a = k / 30 * Math.PI * 2.1; x[k ? 'lineTo' : 'moveTo'](sx + Math.cos(a) * (84 + (R() - .5) * 5), sy + Math.sin(a) * (84 + (R() - .5) * 5)); }
    x.stroke();
    for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2 + tq * 0.2; line(sx + Math.cos(a) * 104, sy + Math.sin(a) * 104, sx + Math.cos(a) * 136, sy + Math.sin(a) * 136, 1.8); }
  }
  // 鸟
  BIRDS.forEach(b => {
    const bx = ((b.x - tq * b.v) % (W + 100) + W + 100) % (W + 100), by = b.y + Math.sin(tq * 2 + b.ph) * 8;
    const flap = Math.sin(tq * 9 + b.ph) * 8;
    line(bx - 18, by - flap, bx, by, 1.8); line(bx, by, bx + 18, by - flap, 1.8);
  });

  const ox = (tq * 90) % LOOPW;
  x.save(); x.beginPath(); x.rect(134, 0, W, H); x.clip();
  HOUSES.forEach(h => { house(h, ox); house({ ...h, x: h.x + LOOPW }, ox); });
  x.restore();

  // 地面
  line(140, GROUND, W, GROUND, 2.6);
  line(140, GROUND + 40, W, GROUND + 40, 1.8);
  for (let i = 0; i < 30; i++) { const gx = ((i * 120 - tq * 90) % (W + 60) + W + 60) % (W + 60) + 120; line(gx, GROUND + 40, gx - 30, WALK + 30, 1.2, '#8a8178'); }
  line(140, WALK + 30, W, WALK + 30, 2.6);
  for (let i = 0; i < 20; i++) { const gx = ((i * 131 - tq * 90) % (W + 100) + W + 100) % (W + 100) + 140; line(gx, WALK + 70 + (i % 3) * 30, gx + 30, WALK + 70 + (i % 3) * 30, 1.4, '#7a7168'); }

  // 路人（灰，铅笔线稿）
  const ph0 = tq / 0.852 * Math.PI * 2;
  PEOPLE.forEach(p => {
    const px = ((p.x + p.dir * tq * p.v - tq * 90) % 3080 + 3080) % 3080 - 200;
    if (px < 120 || px > W + 120) return;
    clawd(px, WALK + 16, p.s * 1.25, ph0 * (p.v / 110) + p.ph, false, p.dir);
  });

  // 他：被涂了颜色
  const hx = 880;
  const lt = t % 4.4;
  const blink = lt > 3.2 && lt < 3.45 ? 1 : 0;
  clawd(hx, WALK + 16, 2.1, ph0, true, 1, blink);
  // 箭头和手写标注
  x.save();
  line(hx + 150, WALK - 260, hx + 92, WALK - 170, 2, '#d9677e');
  line(hx + 92, WALK - 170, hx + 112, WALK - 176, 2, '#d9677e'); line(hx + 92, WALK - 170, hx + 96, WALK - 190, 2, '#d9677e');
  x.font = '38px "Kaiti SC","STKaiti","KaiTi",serif'; x.fillStyle = '#d9677e';
  x.fillText('我', hx + 158, WALK - 266);
  x.restore();

  lyric(t);

  // 页角：日期和页码
  x.font = '26px "Kaiti SC","STKaiti",serif'; x.fillStyle = 'rgba(60,55,50,0.6)';
  x.fillText('11 月 19 日   晴', 1560, 1050);
  x.font = '18px "Songti SC",serif'; x.fillStyle = 'rgba(60,55,50,0.5)'; x.textAlign = 'right';
  x.fillText('风格 C · 铅笔手账', W - 48, 52); x.textAlign = 'left';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
