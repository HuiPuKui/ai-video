<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风格 B · 雨夜霓虹 — 我们都是渺小真实存在</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:auto;display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 电影感雨夜：低机位，湿地面倒影，霓虹灯牌，撑伞的灰色人潮。
// 他没有伞，是画面里唯一的暖色，歌词像霓虹灯管一样逐字点亮。
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 1920, H = 1080, HOR = 760;   // HOR = 地平线（湿地面的反射轴）
const rng = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };

// ---------- 预渲染：远景楼群（两层视差） ----------
function cityLayer(seed, tw, hMin, hMax, tone, winA) {
  const c = document.createElement('canvas'); c.width = tw; c.height = HOR;
  const g = c.getContext('2d'), r = rng(seed);
  let px = 0;
  while (px < tw) {
    const w = 80 + r() * 160, h = hMin + r() * (hMax - hMin);
    g.fillStyle = tone; g.fillRect(px, HOR - h, w, h);
    for (let wy = HOR - h + 18; wy < HOR - 20; wy += 22) for (let wx = px + 10; wx < px + w - 14; wx += 18) {
      const v = r();
      if (v > 0.72) {
        g.fillStyle = v > 0.97 ? `rgba(255,150,190,${winA})` : v > 0.9 ? `rgba(140,200,255,${winA * .8})` : `rgba(255,205,150,${winA * .7})`;
        g.fillRect(wx, wy, 8, 11);
      }
    }
    px += w + r() * 14;
  }
  return c;
}
const TW = 2600;
const cityFar = cityLayer(3, TW, 260, 560, '#141526', 0.35);
const cityNear = cityLayer(7, TW, 140, 360, '#0d0d18', 0.6);

// 霓虹灯牌：固定在中景楼上，随视差移动
const SIGNS = [
  { x: 240, y: 470, w: 64, h: 190, col: '#ff5d9e', txt: '回忆', vert: true },
  { x: 900, y: 520, w: 210, h: 60, col: '#5fd3ff', txt: '24H 便利店' },
  { x: 1480, y: 440, w: 70, h: 230, col: '#ffb35c', txt: '旧时光', vert: true },
  { x: 2060, y: 540, w: 200, h: 56, col: '#ff5d9e', txt: '拼图·照相' },
];

// 雨
const RAIN = (() => { const r = rng(9); return Array.from({ length: 520 }, () => ({ x: r() * (W + 300), y: r() * H, l: 18 + r() * 34, v: 1300 + r() * 900, a: 0.08 + r() * 0.22, z: r() })); })();
// 前景散景光斑
const BOKEH = (() => { const r = rng(15); return Array.from({ length: 26 }, () => ({ x: r() * W, y: r() * H * 0.9, rad: 30 + r() * 90, col: ['255,93,158', '95,211,255', '255,179,92', '255,220,180'][Math.floor(r() * 4)], a: 0.04 + r() * 0.08, v: 6 + r() * 20, ph: r() * 6 })); })();
// 水面涟漪
const RIP = (() => { const r = rng(21); return Array.from({ length: 40 }, () => ({ x: r() * W, y: HOR + 30 + r() * (H - HOR - 40), ph: r(), sp: 0.7 + r() * 0.8 })); })();
// 人潮：撑伞的灰色 Clawd
const CROWD = (() => { const r = rng(31); return Array.from({ length: 9 }, (_, i) => ({ x: i * 300 + r() * 120, s: 1.1 + r() * 0.4, v: 90 + r() * 60, ph: r() * 6, umb: ['#2a2c3c', '#33303f', '#272a36', '#3b2f3e'][Math.floor(r() * 4)], dir: r() > 0.3 ? -1 : 1 })); })();

// ---------- Clawd（矢量像素，可走路） ----------
function clawd(g, cx, cy, s, ph, pal, opt = {}) {
  const S = Math.sin(ph), C = Math.cos(ph);
  const bob = -Math.abs(S) * 3;
  g.save(); g.translate(cx, cy); g.scale(s * (opt.flip || 1), s);
  g.fillStyle = pal.leg;
  [[-26, 0], [-14, 1], [6, 0], [18, 1]].forEach(([lx, k]) => {
    const lift = k ? Math.max(0, -S) : Math.max(0, S);
    g.fillRect(lx + (k ? -C : C) * 2.5, -2 - lift * 6, 8, 16);
  });
  g.translate(0, bob); g.rotate(S * 0.035);
  g.fillStyle = pal.arm;
  if (opt.umbrella) { g.fillRect(-12, -78, 10, 26); }
  else { g.fillRect(-68, -45 + S * 3, 13, 12); }
  g.fillRect(55, -45 - S * 3, 13, 12);
  g.fillStyle = pal.body; g.fillRect(-56, -56, 112, 56);
  if (pal.hi) { g.fillStyle = pal.hi; g.fillRect(-56, -56, 5, 56); }
  if (pal.rim) { g.fillStyle = pal.rim; g.fillRect(51, -56, 5, 56); g.fillRect(-56, -56, 112, 3); }
  const bl = 1 - 0.9 * (opt.blink || 0);
  g.fillStyle = pal.eye; g.fillRect(-9 + (opt.look || 0), -40 + 10 * (1 - bl), 6, 10 * bl); g.fillRect(3 + (opt.look || 0), -40 + 10 * (1 - bl), 6, 10 * bl);
  g.restore();
}
function umbrella(g, cx, cy, s, col, tilt) {
  g.save(); g.translate(cx, cy); g.scale(s, s); g.rotate(tilt);
  g.fillStyle = '#101118'; g.fillRect(-2, -118, 3, 66);
  g.beginPath(); g.moveTo(-90, -110);
  g.quadraticCurveTo(-80, -170, 0, -176); g.quadraticCurveTo(80, -170, 90, -110);
  for (let i = 4; i >= 0; i--) { const ax = -90 + i * 36; g.quadraticCurveTo(ax + 18 - 36, -122, ax, -110); }
  g.closePath(); g.fillStyle = col; g.fill();
  g.strokeStyle = 'rgba(150,180,230,0.18)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-86, -112); g.quadraticCurveTo(-76, -166, 0, -172); g.stroke();
  g.restore();
}

const GREY = { body: '#3a3b4a', arm: '#444556', leg: '#34354a', eye: '#15151e', rim: 'rgba(120,170,255,0.35)' };
const HIM = { body: '#CC8B89', hi: '#E09D9B', arm: '#E9BBBA', leg: '#E09B9B', eye: '#1c1315', rim: 'rgba(255,190,210,0.9)' };

const TEXT = [...'我们都是渺小真实存在'];

// ---------- 场景绘制（先画一遍"世界"，再用它做倒影） ----------
const world = document.createElement('canvas'); world.width = W; world.height = HOR;
const wg = world.getContext('2d');

function drawWorld(t) {
  const g = wg;
  const sky = g.createLinearGradient(0, 0, 0, HOR);
  sky.addColorStop(0, '#070812'); sky.addColorStop(0.55, '#151630'); sky.addColorStop(1, '#3a2340');
  g.fillStyle = sky; g.fillRect(0, 0, W, HOR);
  // 城市光晕
  const glow = g.createRadialGradient(W * 0.55, HOR, 40, W * 0.55, HOR, 900);
  glow.addColorStop(0, 'rgba(255,120,170,0.28)'); glow.addColorStop(1, 'rgba(255,120,170,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, HOR);

  const ofF = (t * 14) % TW, ofN = (t * 34) % TW;
  g.globalAlpha = 0.9; g.drawImage(cityFar, -ofF, 0); g.drawImage(cityFar, TW - ofF, 0); g.globalAlpha = 1;
  g.drawImage(cityNear, -ofN, 0); g.drawImage(cityNear, TW - ofN, 0);

  // 霓虹
  SIGNS.forEach((s, i) => {
    let sx = ((s.x - t * 34) % TW + TW) % TW - 300;
    const flick = (i === 1 && (t % 3.1) > 2.85 && (t * 30 | 0) % 2) ? 0.25 : 1;
    g.save();
    g.globalAlpha = flick;
    g.shadowColor = s.col; g.shadowBlur = 40;
    g.strokeStyle = s.col; g.lineWidth = 4; g.strokeRect(sx, s.y, s.w, s.h);
    g.fillStyle = s.col; g.font = `600 ${s.vert ? 44 : 30}px "PingFang SC","Noto Sans CJK SC",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (s.vert) [...s.txt].forEach((ch, k) => g.fillText(ch, sx + s.w / 2, s.y + 50 + k * 64));
    else g.fillText(s.txt, sx + s.w / 2, s.y + s.h / 2 + 2);
    g.restore();
  });

  // 街灯
  for (let i = 0; i < 4; i++) {
    const lx = ((i * 620 + 200 - t * 70) % 2480 + 2480) % 2480 - 280;
    g.fillStyle = '#0a0a12'; g.fillRect(lx, HOR - 380, 8, 380); g.fillRect(lx, HOR - 380, 60, 8);
    const cone = g.createLinearGradient(0, HOR - 372, 0, HOR);
    cone.addColorStop(0, 'rgba(255,214,160,0.35)'); cone.addColorStop(1, 'rgba(255,214,160,0)');
    g.fillStyle = cone; g.beginPath(); g.moveTo(lx + 44, HOR - 372); g.lineTo(lx + 64, HOR - 372); g.lineTo(lx + 170, HOR); g.lineTo(lx - 60, HOR); g.fill();
    g.save(); g.shadowColor = '#ffd6a0'; g.shadowBlur = 30; g.fillStyle = '#ffe7c4'; g.fillRect(lx + 44, HOR - 374, 22, 6); g.restore();
  }

  // 人潮
  const ph0 = t / 0.852 * Math.PI * 2;
  CROWD.forEach((p) => {
    const px = ((p.x + p.dir * t * p.v) % 2660 + 2660) % 2660 - 370;
    const ph = ph0 * (p.v / 120) + p.ph;
    clawd(g, px, HOR - 14, p.s * 0.78, ph, GREY, { umbrella: true, flip: p.dir });
    umbrella(g, px + p.dir * -6 * p.s, HOR - 14 - Math.abs(Math.sin(ph)) * 3, p.s * 0.78, p.umb, p.dir * 0.05);
  });

  // 他
  const hx = 820, hy = HOR - 14;
  const lt = t % 4.6;
  const blink = lt > 3.4 && lt < 3.62 ? Math.sin((lt - 3.4) / 0.22 * Math.PI) : 0;
  const halo = g.createRadialGradient(hx, hy - 60, 10, hx, hy - 60, 260);
  halo.addColorStop(0, 'rgba(255,150,180,0.22)'); halo.addColorStop(1, 'rgba(255,150,180,0)');
  g.fillStyle = halo; g.fillRect(hx - 300, hy - 340, 600, 360);
  clawd(g, hx, hy, 2.1, ph0, HIM, { blink, look: 1.2 });
  // 头顶积的雨滴
  g.fillStyle = 'rgba(200,230,255,0.7)';
  for (let k = 0; k < 6; k++) { const yy = ((t * 1.5 + k * 0.17) % 1); g.fillRect(hx - 100 + k * 40, hy - 2.1 * 56 - 8 + yy * 120, 2, 10); }
}

function frame(now) {
  const t = now / 1000;
  drawWorld(t);
  x.drawImage(world, 0, 0);

  // 倒影：翻转 + 压暗 + 横向抖动
  x.fillStyle = '#05050b'; x.fillRect(0, HOR, W, H - HOR);
  const strip = 6;
  for (let y = 0; y < H - HOR; y += strip) {
    const k = y / (H - HOR);
    const dx = Math.sin(y * 0.09 + t * 3.2) * (2 + k * 10);
    x.globalAlpha = 0.55 * (1 - k * 0.65);
    x.drawImage(world, 0, HOR - y - strip, W, strip, dx, HOR + y, W, strip);
  }
  x.globalAlpha = 1;
  const wet = x.createLinearGradient(0, HOR, 0, H);
  wet.addColorStop(0, 'rgba(10,10,25,0.15)'); wet.addColorStop(1, 'rgba(5,5,12,0.75)');
  x.fillStyle = wet; x.fillRect(0, HOR, W, H - HOR);
  x.fillStyle = 'rgba(255,200,220,0.25)'; x.fillRect(0, HOR, W, 2);

  // 涟漪
  RIP.forEach(p => {
    const k = (t * p.sp + p.ph) % 1;
    x.strokeStyle = `rgba(190,210,255,${0.35 * (1 - k)})`; x.lineWidth = 1.5;
    x.beginPath(); x.ellipse(p.x, p.y, 4 + k * 40, 1 + k * 7, 0, 0, Math.PI * 2); x.stroke();
  });

  // 雨（斜）
  x.lineCap = 'round';
  RAIN.forEach(d => {
    const yy = (d.y + t * d.v) % (H + 60) - 60;
    const xx = (d.x - (t * d.v * 0.18) % (W + 300) + W + 300) % (W + 300) - 150;
    x.strokeStyle = `rgba(200,215,255,${d.a})`; x.lineWidth = 1 + d.z * 1.4;
    x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx - d.l * 0.18, yy + d.l); x.stroke();
  });

  // 前景散景
  x.globalCompositeOperation = 'lighter';
  BOKEH.forEach(b => {
    const bx = ((b.x - t * b.v) % (W + 200) + W + 200) % (W + 200) - 100;
    const by = b.y + Math.sin(t * 0.6 + b.ph) * 10;
    const gr = x.createRadialGradient(bx, by, b.rad * 0.6, bx, by, b.rad);
    gr.addColorStop(0, `rgba(${b.col},${b.a})`); gr.addColorStop(1, `rgba(${b.col},0)`);
    x.fillStyle = gr; x.beginPath(); x.arc(bx, by, b.rad, 0, Math.PI * 2); x.fill();
  });
  x.globalCompositeOperation = 'source-over';

  // 歌词：霓虹灯管逐字点亮（8 秒循环）
  const ct = t % 8;
  x.save();
  x.font = '600 76px "Songti SC","Noto Serif CJK SC",serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const gap = 96, x0 = W / 2 - (TEXT.length - 1) * gap / 2;
  TEXT.forEach((ch, i) => {
    const on = ct - 0.4 - i * 0.3;
    const out = Math.max(0, Math.min(1, (ct - 7.3) / 0.5));
    if (on <= 0) { x.globalAlpha = 0.12; x.fillStyle = '#665a70'; x.fillText(ch, x0 + i * gap, 170); return; }
    const flick = on < 0.22 ? ((on * 40 | 0) % 2 ? 0.3 : 1) : 1;
    const pink = i >= 8;
    x.globalAlpha = flick * (1 - out * 0.85);
    x.shadowColor = pink ? '#ff5d9e' : '#ffd9e6'; x.shadowBlur = 28;
    x.fillStyle = pink ? '#ff8fbc' : '#fff1f6';
    x.fillText(ch, x0 + i * gap, 170);
  });
  x.restore();

  // 电影黑边 + 暗角
  const vg = x.createRadialGradient(W / 2, H * 0.55, H * 0.35, W / 2, H * 0.55, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
  x.fillStyle = '#000'; x.fillRect(0, 0, W, 56); x.fillRect(0, H - 56, W, 56);
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '18px "Songti SC",serif'; x.textAlign = 'right';
  x.fillText('风格 B · 雨夜霓虹', W - 48, 36);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
