const NS = 'http://www.w3.org/2000/svg';
const $ = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const rng = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };
const f = (v) => (+v).toFixed(2);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeIn = (k) => Math.pow(clamp(k, 0, 1), 2);
const smooth = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };

/* ============ 节拍 ============
   实测：底鼓每拍一击，BPM 140.81，网格相位 0.146s，
   鼓点比网格平均晚约 30ms（用网格 +0.03 做动画触发）。 */
const PERIOD = 0.4261, PHASE = 0.146, KICK_LAG = 0.03;
const BARS = [1.8504, 3.5548, 5.2592, 6.9636, 8.668, 10.3724, 12.0768, 13.7812, 15.4856, 17.19, 18.8944];
const beats = [];
for (let i = 0; i < 48; i++) beats.push(+(PHASE + PERIOD * i).toFixed(4));
const beatIndex = (t) => Math.floor((t - PHASE) / PERIOD + 1e-6);
const beatPhase = (t) => (t - PHASE) / PERIOD;          // 整数部分 = 第几拍
const kickEnv = (t) => {                                 // 每次底鼓的冲击包络 0..1
  const p = (t - PHASE - KICK_LAG) / PERIOD;
  const frac = p - Math.floor(p);
  return frac < 0 ? 0 : Math.pow(1 - frac, 5);
};
const barKick = (t) => {                                 // 只在小节重拍（每 4 拍）给冲击
  const p = (t - PHASE - KICK_LAG) / PERIOD;
  const n = Math.floor(p);
  if (n % 4 !== 0) return 0;
  const frac = p - n;
  return frac < 0 ? 0 : Math.pow(1 - frac, 4);
};

/* ============ 剪纸几何 ============ */
function cutRect(x, y, w, h, j, r, step = 8) {
  const pts = [];
  const edge = (x0, y0, x1, y1) => {
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let i = 0; i < n; i++) { const k = i / n; pts.push([x0 + (x1 - x0) * k + (r() - .5) * j, y0 + (y1 - y0) * k + (r() - .5) * j]); }
  };
  edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
  return 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
}
function tornBand(x0, x1, y, amp, bottom, r, step = 16) {
  let d = `M${x0} ${bottom}`;
  for (let x = x0; x <= x1 + step; x += step) d += `L${f(x)} ${f(y + (r() - .5) * amp + Math.sin(x * 0.004) * amp)}`;
  return d + `L${x1 + step} ${bottom}Z`;
}
function tabEdge(P, Q, d) {
  const ux = Q[0] - P[0], uy = Q[1] - P[1], nx = uy, ny = -ux;
  const pt = (s, h) => f(P[0] + ux * s + nx * h) + ' ' + f(P[1] + uy * s + ny * h);
  if (!d) return `L${pt(1, 0)}`;
  return `L${pt(.38, 0)}C${pt(.44, .06 * d)} ${pt(.22, .27 * d)} ${pt(.5, .28 * d)}C${pt(.78, .27 * d)} ${pt(.56, .06 * d)} ${pt(.62, 0)}L${pt(1, 0)}`;
}
function piece(x, y, w, h, dt, dr, db, dl) {
  return `M${f(x)} ${f(y)}` + tabEdge([x, y], [x + w, y], dt) + tabEdge([x + w, y], [x + w, y + h], dr) +
    tabEdge([x + w, y + h], [x, y + h], db) + tabEdge([x, y + h], [x, y], dl) + 'Z';
}

/* ============ Clawd 纸片人 ============ */
const LEGX = [-26, -14, 6, 18];
const PAL = {
  him:   { body: '#CC8B89', hi: '#E09D9B', arm: '#E9BBBA', leg: '#E09B9B', eye: '#1c1315' },
  her:   { body: '#F4A8C2', hi: '#F9C9D8', arm: '#F8D2E0', leg: '#EFA0BC', eye: '#1c1315' },
  grey:  { body: '#b7ada3', hi: '#c6bdb3', arm: '#c4bbb1', leg: '#aca297', eye: '#6b625b' },
  grey2: { body: '#a69c92', hi: '#b5aba1', arm: '#b3a99f', leg: '#9d9389', eye: '#5d554f' },
};
function paperClawd(parent, pal, seed, border = 4) {
  const r = rng(seed);
  const root = $('g', {}, parent);
  const part = (d, fill, g) => $('path', { d, fill, stroke: border ? '#fbf7ef' : 'none', 'stroke-width': border, 'stroke-linejoin': 'round', 'paint-order': 'stroke' }, g);
  const legA = $('g', {}, root), legB = $('g', {}, root);
  LEGX.forEach((x, i) => part(cutRect(x, -3, 8, 16, 1.2, r, 5), pal.leg, i % 2 ? legB : legA));
  const armL = $('g', {}, root), armR = $('g', {}, root);
  part(cutRect(-68, -45, 13, 12, 1.2, r, 5), pal.arm, armL);
  part(cutRect(55, -45, 13, 12, 1.2, r, 5), pal.arm, armR);
  const body = $('g', {}, root);
  part(cutRect(-56, -56, 112, 56, 1.8, r, 9), pal.body, body);
  $('path', { d: cutRect(-52, -52, 6, 46, 0.8, r, 6), fill: pal.hi }, body);
  const eyes = $('g', {}, body);
  $('path', { d: cutRect(-9, -40, 6, 10, 0.6, r, 4), fill: pal.eye }, eyes);
  $('path', { d: cutRect(3, -40, 6, 10, 0.6, r, 4), fill: pal.eye }, eyes);
  return { root, legA, legB, armL, armR, body, eyes };
}
/* 走路姿态：ph 每 +2π 走完两步。squash = 落地挤压量 */
function pose(c, ph, x, y, s, blink = 0, squash = 0) {
  const S = Math.sin(ph), C = Math.cos(ph);
  const bob = -Math.abs(S) * 3.5;
  const sy = 1 - squash * 0.10, sx = 1 + squash * 0.06;
  c.root.setAttribute('transform', `translate(${f(x)} ${f(y)}) scale(${s})`);
  c.legA.setAttribute('transform', `translate(${f(C * 2.5)} ${f(-Math.max(0, S) * 7)})`);
  c.legB.setAttribute('transform', `translate(${f(-C * 2.5)} ${f(-Math.max(0, -S) * 7)})`);
  c.body.setAttribute('transform', `translate(0 ${f(bob)}) rotate(${f(S * 2.4)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
  c.armL.setAttribute('transform', `translate(0 ${f(bob + S * 3)})`);
  c.armR.setAttribute('transform', `translate(0 ${f(bob - S * 3)})`);
  const k = 1 - 0.92 * blink;
  c.eyes.setAttribute('transform', `translate(0 -30) scale(1 ${k.toFixed(3)}) translate(0 30)`);
}

const HOUSE = [

  { text: '直到遇见你我以为就光明起来', t: 8.37, chars: [8.37, 8.52, 8.80, 8.99, 9.23, 9.40, 9.72, 9.82, 10.01, 10.26, 10.52, 10.66, 11.02], end: 11.70, pinkFrom: 4 },
  { text: '眼睛里看到的都是广袤无垠的大海', t: 11.79, chars: [11.79, 11.98, 12.13, 12.42, 12.56, 12.74, 13.00, 13.17, 13.41, 13.64, 14.01, 14.11, 14.26, 14.49, 14.74], end: 15.40, pinkFrom: 13 },
  { text: '有你在的日子里不可能被取代', t: 15.60, chars: [15.60, 15.82, 15.96, 16.14, 16.41, 16.64, 16.89, 17.05, 17.41, 17.51, 17.61, 17.95, 18.22], end: 19.10, pinkFrom: 1 },

/* Film edit. Measured low-frequency attacks, in source-audio seconds.

const ATTACKS = [.095,.515,1.025,1.415,1.895,2.295,2.7,3.125,3.55,4.025,4.4,4.825,5.255,5.705,6.105,6.55,6.965,7.385,7.86,8.26,8.665,9.105,9.565,9.99,10.37,10.81,11.22,11.695,12.12,12.515,12.925,13.375,13.825,14.22,14.635,15.005,15.53,15.93,16.335,16.76,17.185,17.635,18.035,18.46,18.89];
ATTACKS.push(19.365,19.79,20.21,20.595,21.02,21.495,21.895,22.3,22.725,23.2,23.575,24.005,24.445,24.86,25.28,25.755,26.15,26.56,27.035,27.46,27.81,28.265,28.685,29.12,29.56,29.97,30.395,30.82,31.245,31.675,32.095,32.555,32.97,33.42,33.805,34.23,34.68,35.085,35.525,35.935,36.385,36.81,37.255,37.64,38.065,38.49,38.93,39.355,39.785,40.245,40.645,41.05,41.49,41.905,42.295,42.755,43.195,43.605,44.055,44.455,44.9,45.31,45.8,46.16,46.53,47.02,47.44,47.915,48.315,48.72,49.185,49.57,50.045,50.425,50.89,51.275,51.7,52.125,52.55,52.98,53.405,53.88,54.28,54.685,55.125,55.54,55.91,56.46,56.93);

// Sentence boundaries come from the supplied LRC. Character interpolation is

restLyrics.forEach(([text,t,end])=>LINES.push({text,t,end,pinkFrom:99,chars:[...text].map((_,i)=>t+i*(end-t-.5)/[...text].length)}));
const ink = '#263f3b', paper = '#f4f0e7', coral = '#da6b71', pink = '#efa4bc', teal = '#337e80', yellow = '#e9c65f';
const svg = document.getElementById('s');
// Keep the original hand-cut geometry and character rig, replace the single-stage edit.
for (const child of [...svg.children]) if (child.tagName.toLowerCase() !== 'defs') child.remove();
const film = $('g', {}, svg), captions = $('g', {}, svg), overlay = $('g', {}, svg);
const matte = $('rect', {width:1920,height:1080,filter:'url(#grain)',opacity:.24,'pointer-events':'none'},svg);
let serial=300;
function group(p,attrs={}) { return $('g',attrs,p); }
function rect(p,x,y,w,h,c,shadow=false) { return $('path',{d:cutRect(x,y,w,h,2.4,rng(serial++),14),fill:c,...(shadow?{filter:'url(#shadow)'}:{})},p); }
function path(p,d,c,attrs={}) { return $('path',{d,fill:c,...attrs},p); }
function txt(p,value,x,y,size,c=ink,attrs={}) { const e=$('text',{x,y,'font-size':size,fill:c,'font-family':'Songti SC, STSong, serif','font-weight':700,...attrs},p);e.textContent=value;return e; }
function ring(p,x,y,r,c) { const rand=rng(serial++); let d='';for(let i=0;i<64;i++){const a=i*Math.PI/32,rr=r+(rand()-.5)*4;d+=(i?'L':'M')+f(x+Math.cos(a)*rr)+' '+f(y+Math.sin(a)*rr);}return path(p,d+'Z',c); }
function tr(e,x=0,y=0,s=1,rot=0) { e.setAttribute('transform',`translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${f(s)})`); }
function show(e,k) { e.setAttribute('opacity',clamp(k,0,1)); }
function grid(p,c='#75877c',space=80) { for(let x=0;x<1920;x+=space)path(p,`M${x} 0V1080`,'none',{stroke:c,'stroke-width':1,opacity:.16});for(let y=0;y<1080;y+=space)path(p,`M0 ${y}H1920`,'none',{stroke:c,'stroke-width':1,opacity:.16}); }
function actor(p,sex,x,y,s=2) { const a=paperClawd(p,sex?PAL.her:PAL.him,serial++,3);a.root.setAttribute('filter','url(#shadow)'); if(sex){rect(a.body,24,-64,22,9,coral);rect(a.body,32,-72,8,25,coral);} pose(a,0,x,y,s);return a; }
function puzzle(p,x,y,s,c) { const g=group(p,{filter:'url(#shadow)'});path(g,piece(-50,-50,100,100,1,-1,1,-1),c,{stroke:paper,'stroke-width':2});tr(g,x,y,s);return g; }
function burst(p,x,y,c,count=12) {const g=group(p); for(let i=0;i<count;i++){const a=i*Math.PI*2/count;rect(g,Math.cos(a)*190,Math.sin(a)*190,12,40,c); }tr(g,x,y);return g;}
function boat(p,x,y,s=1) {const g=group(p,{filter:'url(#shadow)'});path(g,'M-145 0L140 0 70 68 -80 68Z',coral);path(g,'M-8 -220L-8 -16 -134 -16Z',paper);path(g,'M8 -190L115 -16 8 -16Z',yellow);tr(g,x,y,s);return g;}
function waves(p,y=500) {const g=group(p),arr=[];const cols=['#a8d3cd','#70b3b6','#337e80','#236065','#17464d'];for(let i=0;i<5;i++){let w=group(g,{filter:'url(#shadowSm)'});path(w,tornBand(-400,2320,y+i*105,30,1300,rng(600+i),18),cols[i]);for(let j=0;j<11;j++)rect(w,j*210-100,y+i*105+45,90,5,'#d4e7dc');arr.push(w);}return {g,arr};}
function sunburst(p,x,y,r,c){let g=group(p);for(let i=0;i<20;i++){let a=i*Math.PI/10;path(g,`M${x+Math.cos(a-.045)*r} ${y+Math.sin(a-.045)*r}L${x+Math.cos(a)*r*2.8} ${y+Math.sin(a)*r*2.8}L${x+Math.cos(a+.045)*r} ${y+Math.sin(a+.045)*r}Z`,c);}ring(g,x,y,r,c);return g;}
const shots=[];
function shot(name,start,end,bg,draw,animate) {const g=group(film);rect(g,0,0,1920,1080,bg);const camera=group(g);rect(camera,-600,-400,3120,1880,bg);const data=draw(camera);shots.push({name,start,end,g,camera,data,animate});return g;}
function camera(s,x=960,y=540,z=1,rot=0){s.camera.setAttribute('transform',`translate(960 540) rotate(${rot}) scale(${z}) translate(${-x} ${-y})`);}
function city(p,night=false) {const r=rng(740);let buildings=[];for(let i=0;i<15;i++){let x=i*144-80,h=220+r()*420,g=group(p,{filter:'url(#shadowSm)'});rect(g,x,800-h,125,h,night?'#31514f':['#a8ada5','#c7c9bf','#8d9a92'][i%3]);for(let a=0;a<3;a++)for(let b=0;b<Math.floor(h/58)-1;b++)rect(g,x+17+a*34,820-h+b*55,15,26,night?yellow:paper);buildings.push(g);}return buildings;}

// Compact paper captions stay in a fixed safe area across every composition.
const captionLines=LINES.map((line,li)=>{
  let g=group(captions,{filter:'url(#shadowSm)'}),w=[...line.text].length*58+58;
  rect(g,960-w/2,894,w,88,paper);let chars=[...line.text].map((ch,i)=>txt(g,ch,960-w/2+30+i*58,956,44,ink));return{g,chars,line};
});
const splice=group(overlay);const spliceBars=[];for(let i=0;i<12;i++)spliceBars.push(rect(splice,i*165-10,-20,180,1140,i%3===0?pink:paper));
const dust=[];for(let i=0;i<28;i++){let g=rect(overlay,0,0,8+i%4*3,5+i%3*3,[pink,yellow,paper,teal][i%4]);dust.push(g);}
function renderFilm(t) {
  t=clamp(t,0,END);let bi=-1;for(let i=0;i<ATTACKS.length;i++)if(ATTACKS[i]<=t)bi=i;
  const age=bi<0?99:t-ATTACKS[bi],kick=Math.exp(-age*23),snare=bi%2?kick:0;
  let current=shots.find(s=>t>=s.start&&t<s.end)||shots.at(-1);
  for(const s of shots){s.g.style.display=s===current?'':'none';if(s===current)s.animate(s,t,t-s.start,kick);}
  captionLines.forEach(({g,chars,line},i)=>{
    const end=i<LINES.length-1?LINES[i+1].t:line.end,active=t>=line.t&&t<end;g.style.display=active?'':'none';
    if(active)chars.forEach((c,j)=>{const a=t-line.chars[j],hit=Math.exp(-Math.max(0,a)*18);c.setAttribute('fill',a>=0?(j>=line.pinkFrom?coral:ink):'#9fa59b');c.setAttribute('transform',`translate(0 ${a>=0?-hit*9:0})`);});
  });
  const ageCut=t-current.start,transition=[4,7,10,14,17,20,22,24,26,29,32,34,36,38].includes(shots.indexOf(current));
  splice.style.display=transition&&ageCut<.16?'':'none';
  if(transition)spliceBars.forEach((g,i)=>tr(g,0,-1250*easeOut((ageCut-i*.004)/.11)));
    dust.forEach((g,i)=>{let a=i*2.399,dist=90+age*(280+i*14);show(g,age<.26&&t>1.4&&!(t>=35.085&&t<38.065)&&t<56.46?(1-age/.26)*.65:0);tr(g,960+Math.cos(a)*dist*2.8,590+Math.sin(a)*dist,.8,age*(i%2?160:-160));});
  window.__frame={time:t,shot:current.name,beat:bi};
}

window.__shots=shots.map(({name,start,end})=>({name,start,end}));

/* Local audio clock; visual time stays on the original film timeline. */
const CLIP_START=14.22, CLIP_END=15.53, DURATION=1.31;
const audio=new Audio('./配乐.wav');audio.preload='auto';
const controls=document.createElement('div');controls.className='transport';
controls.innerHTML="<button id=\"play\" title=\"播放 / 暂停\" aria-label=\"播放\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m8 5 11 7-11 7Z\"/></svg></button><button id=\"replay\" title=\"从头播放\" aria-label=\"从头播放\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 10a9 9 0 1 1 2 9M3 3v7h7\"/></svg></button><input id=\"seek\" type=\"range\" min=\"0\" max=\"59\" step=\"0.01\" value=\"0\" aria-label=\"播放进度\"><span id=\"time\">00:00 / 00:59</span><button id=\"sound\" title=\"静音\" aria-label=\"静音\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m11 5-6 4H2v6h3l6 4ZM15 8q5 4 0 8M18 5q8 7 0 14\"/></svg></button><button id=\"full\" title=\"全屏\" aria-label=\"全屏\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5\"/></svg></button>";
document.body.appendChild(controls);
const play=document.getElementById('play'),seek=document.getElementById('seek'),timeLabel=document.getElementById('time');
seek.max=DURATION;seek.step='0.001';
let still=clamp(+(new URLSearchParams(location.search).get('t')||0),0,DURATION),frameId=0;
const clock=n=>Math.floor(n/60).toString().padStart(2,'0')+':'+(n%60).toFixed(2).padStart(5,'0');
function updateUI(){const p=!audio.paused;play.setAttribute('aria-label',p?'暂停':'播放');play.querySelector('path').setAttribute('d',p?'M8 5v14M16 5v14':'m8 5 11 7-11 7Z');document.body.classList.toggle('running',p);}
function draw(){renderFilm(CLIP_START+Math.min(still,Math.max(0,DURATION-0.0001)));seek.value=still;timeLabel.textContent=clock(still)+' / '+clock(DURATION);}
function tick(){cancelAnimationFrame(frameId);if(!audio.paused){still=Math.min(audio.currentTime,DURATION);if(still>=DURATION){audio.pause();updateUI();}}draw();if(!audio.paused)frameId=requestAnimationFrame(tick);}
async function start(){try{if(still>=DURATION)still=0;audio.currentTime=still;await audio.play();updateUI();tick();}catch(error){timeLabel.textContent='音频未能播放';console.error(error);}}
play.onclick=()=>{if(audio.paused)start();else{still=audio.currentTime;audio.pause();updateUI();tick();}};
document.getElementById('replay').onclick=()=>{still=0;start();};
seek.oninput=()=>{still=+seek.value;audio.currentTime=still;tick();};
document.getElementById('sound').onclick=e=>{audio.muted=!audio.muted;const b=e.currentTarget;b.style.opacity=audio.muted?.45:1;b.title=audio.muted?'取消静音':'静音';b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',audio.muted);};
document.getElementById('full').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();play.click();}});
audio.addEventListener('pause',updateUI);audio.addEventListener('ended',()=>{still=DURATION;tick();});
window.__audio=audio;window.__clip={start:CLIP_START,end:CLIP_END,duration:DURATION};
window.__render=t=>renderFilm(CLIP_START+clamp(t,0,Math.max(0,DURATION-.0001)));
