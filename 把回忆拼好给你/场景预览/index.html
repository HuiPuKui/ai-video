<style>
*{box-sizing:border-box}body{margin:0;background:#141916;color:#e9ece5;font:15px "PingFang SC","Microsoft YaHei",sans-serif}header,footer{max-width:1440px;margin:auto;padding:18px 4vw;display:flex;align-items:center;gap:18px}header{justify-content:space-between}h1{font-size:19px;margin:0}small,time{color:#abb8aa;font:12px ui-monospace,monospace}main{background:#101512}.stage{position:relative;width:min(100%,calc(70svh * 16 / 9));aspect-ratio:16/9;margin:auto}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.lyric{position:absolute;bottom:4%;left:0;width:100%;text-align:center;color:#fff9ec;font:600 18px "Songti SC",serif;text-shadow:0 1px 3px #241d26,0 0 7px #241d26;margin:0}footer{align-items:stretch;flex-direction:column;gap:12px}.meta{display:flex;align-items:baseline;gap:16px}.meta strong{font:600 21px "Songti SC",serif}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}button{cursor:pointer;text-align:left;border:0;border-top:2px solid #434d44;background:transparent;color:#a8b0a8;padding:12px 3px;font:inherit}button[aria-pressed=true]{border-color:#e8bf86;color:#fff1cc}button:hover{background:#202821}button span{font:12px monospace;margin-right:9px}button:focus-visible{outline:2px solid #fff} @media(max-width:620px){header,footer{padding:16px}.stage{width:100%}.lyric{font-size:12px}nav{grid-template-columns:repeat(3,1fr)}button{font-size:13px}.meta{justify-content:space-between}small{font-size:10px}}

.mood{padding-left:2%;border-left:2px solid #e4caa5;display:grid;gap:4px;color:#725364;font-size:12px}
.meter{display:flex;gap:2px}.meter i{width:8px;height:7px;background:#eb896e}.meter i:last-child{background:#e2d0ba}
